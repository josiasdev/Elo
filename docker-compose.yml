services:
  # Banco de dados PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: elociv-postgres
    restart: always
    environment:
      POSTGRES_USER: elociv
      POSTGRES_PASSWORD: elociv_password
      POSTGRES_DB: elociv_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elociv -d elociv_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Servidor Backend Fastify (opcional: pode rodar local via npm dev)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elociv-backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
